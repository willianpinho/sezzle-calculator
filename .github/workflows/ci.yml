name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/{seen=1; if ($3 != "100.0%") exit 1} END {if (!seen) exit 1}'
          go vet ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: warn

  browser-and-container:
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - run: docker build --tag calculator:ci .
      - run: docker run --detach --name calculator -p 8080:8080 calculator:ci
      - run: |
          for _ in $(seq 1 20); do
            curl --fail --silent --show-error http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data '{"operation":"add","a":2,"b":3}' \
            http://127.0.0.1:8080/api/calculate | node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const actual = JSON.parse(body);
                if (Object.keys(actual).length !== 1 || actual.result !== 5) {
                  process.exitCode = 1;
                }
              });
            '
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -qi '<!doctype html>'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/openapi.json | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const document = JSON.parse(body);
              if (!document.openapi || !document.paths["/api/calculate"]) {
                process.exitCode = 1;
              }
            });
          '
          curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            http://127.0.0.1:8080/api/docs | grep -E '^307 .*/docs/$'
          for asset in swagger-ui-bundle.js swagger-ui.css swagger-ui-bundle.js.LICENSE.txt LICENSE NOTICE; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8080/docs/$asset"
          done
      - run: docker rm --force calculator
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
